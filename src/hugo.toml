baseURL = 'https://lifeguard.guide/'
locale = 'en-us'
title = "Harrison's Guide to Lifeguarding"
theme = 'hugo-book'
copyright = '© 2026 Harrison Goeldner'
enableGitInfo = true

# Required for mermaid and katex shortcodes
[markup.goldmark.renderer]
  unsafe = true

[services.googleAnalytics]
  id = 'G-XHFKQPTTWK'


[params]
  BookLogo = 'logo.png'
  BookSection = '/'
  BookRepo = 'https://github.com/harrisongoeldner/lifeguarding-guide/'
  BookLastChangeLink = '{{ .Site.Params.BookRepo }}/commit/{{ .GitInfo.Hash }}'
  BookEditLink = '{{ .Site.Params.BookRepo }}/edit/main/src/{{ .Path }}'
  BookSearch = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
